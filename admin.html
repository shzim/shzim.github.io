<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Shariar Hossain Zim</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>
<body class="admin-body">

  <!-- Admin Login View -->
  <div id="admin-login-view" class="admin-container">
    <div class="glass-panel login-card">
      <div class="card-header">
        <h2>Admin Portal</h2>
        <p>Sign in to manage & publish portfolio gallery photos</p>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label for="admin-username">Username or Email</label>
          <input type="text" id="admin-username" placeholder="e.g. zimbo" required autocomplete="username">
        </div>
        <div class="form-group">
          <label for="admin-password">Password</label>
          <input type="password" id="admin-password" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <div id="login-status-msg" class="status-msg error" style="margin-top: 1rem;"></div>
        <button type="submit" class="cta-btn primary-btn full-width" style="margin-top: 1.5rem;">Sign In to Dashboard</button>
      </form>
    </div>
  </div>

  <script type="module" src="admin.js"></script>
</body>
</html>
